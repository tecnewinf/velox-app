<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox - Sem Conexão</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: UberMove, UberMoveText, system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #1e3a8a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        .offline-container {
            background: #ffffff;
            color: #1f2937;
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-container {
            width: 96px;
            height: 96px;
            background-color: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-container svg {
            width: 48px;
            height: 48px;
            fill: #1e3a8a;
        }

        .error-code {
            font-size: 14px;
            font-weight: 700;
            color: #ef4444;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1e3a8a;
        }

        p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn-retry {
            width: 100%;
            background: #1e3a8a;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-retry:hover {
            background: #1d4ed8;
        }

        .btn-retry:active {
            transform: scale(0.98);
        }

        .status-badge {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #9ca3af;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="offline-container">
        <div class="icon-container">
            <!-- Ícone de WiFi Desconectado / Offline -->
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.53L18.18 13.8 23.64 7zM3.27 1.44L2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01L15.6 17 Johns-end l5.68 5.68 1.27-1.27L3.27 1.44zM12 16l-3.86-4.81 7.11 7.11L12 16z"/>
            </svg>
        </div>

        <div class="error-code">Erro 404 / Sem Conexão</div>
        <h1>Você está offline</h1>
        <p>Não foi possível carregar o mapa e os serviços do <strong>Velox</strong>. Verifique sua conexão com a internet para calcular rotas e chamar seu motorista.</p>

        <button class="btn-retry" onclick="tentarNovamente()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Tentar Novamente
        </button>

        <div class="status-badge">
            <span class="status-dot"></span> Aguardando rede...
        </div>
    </div>

    <script>
        function tentarNovamente() {
            if (navigator.onLine) {
                window.location.href = 'index.html';
            } else {
                alert('Ainda sem conexão. Por favor, conecte-se à internet e tente novamente.');
            }
        }

        // Tenta reconectar automaticamente assim que a conexão voltar
        window.addEventListener('online', () => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
